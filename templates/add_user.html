<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Foydalanuvchi Qo'shish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="fw-bold mb-4 text-center">Yangi Akkaunt Yaratish</h3>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Foydalanuvchi nomi</label>
                    <input type="text" name="username" class="form-control" required placeholder="Masalan: jasur">
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-bold">Parol</label>
                    <input type="password" name="password" class="form-control" required placeholder="Parol kiriting">
                </div>

                <div class="mb-4">
                    <label class="form-label font-weight-bold">Roli (Huquqi)</label>
                    <select name="role" class="form-select">
                        <option value="user">Oddiy Foydalanuvchi</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-2">Saqlash</button>
                <a href="/admin/users" class="btn btn-outline-secondary w-100 py-2">Bosh sahifaga qaytish</a>
            </form>
        </div>
    </div>
</body>
</html>
