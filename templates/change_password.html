<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni o'zgartirish</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4 fw-bold">Parolni o'zgartirish</h3>
            
            {% if error %}
                <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Eski parol:</label>
                    <input type="password" name="old_password" class="form-control" placeholder="Joriy parolingiz" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Yangi parol:</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Yangi parol (kamida 4 belgi)" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Yangi parolni tasdiqlang:</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Yangi parolni takrorlang" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Saqlash</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary w-100 text-center mt-2 py-2">Bekor qilish</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
