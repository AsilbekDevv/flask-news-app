<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parolni tiklash - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="card-title text-center mb-3">Parolni o'zgartirish</h4>
            <p class="text-center text-muted mb-4">Foydalanuvchi: <strong class="text-dark">{{ target_user.username }}</strong></p>
            
            {% if error %}
                <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Yangi parol kiriting:</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Yangi parol..." required>
                </div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">O'zgartirishni saqlash</button>
                <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary w-100 text-center mt-2 py-2">Orqaga</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
