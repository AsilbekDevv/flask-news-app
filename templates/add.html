<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangi Yangilik Qo'shish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-success">Yangi yangilik qo'shish</h3>
            
            <form method="POST" action="/admin/add" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Sarlavha:</label>
                    <input type="text" name="title" class="form-control" placeholder="Sarlavhani kiriting..." required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Matn:</label>
                    <textarea name="content" rows="5" class="form-control" placeholder="Batafsil matn..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Rasm yuklash:</label>
                    <input type="file" name="image" accept="image/*" class="form-control">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Saqlash</button>
                <a href="/admin" class="btn btn-link text-secondary w-100 mt-2 text-center text-decoration-none">Bekor qilish</a>
            </form>
        </div>
    </div>
</body>
</html>
