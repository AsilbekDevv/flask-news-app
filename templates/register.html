<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <h3 class="text-center mb-4 text-success fw-bold">Ro'yxatdan o'tish</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label font-weight-bold">Foydalanuvchi nomi</label>
                <input type="text" name="username" class="form-control" placeholder="Yangi login kiriting" required autofocus>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Parol</label>
                <input type="password" name="password" class="form-control" placeholder="Parol o'ylab toping" required>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 mb-3 fw-bold">Ro'yxatdan o'tish</button>
        </form>

        <div class="text-center">
            <span class="text-muted">Akkauntingiz bormi?</span> 
            <a href="/login" class="text-decoration-none fw-bold">Kirish</a>
        </div>
    </div>
</body>
</html>
