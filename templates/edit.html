<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangilikni Tahrirlash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-warning">Yangilikni tahrirlash</h3>
            
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-bold">Sarlavha:</label>
                    <input type="text" name="title" value="{{ news.title }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Matn:</label>
                    <textarea name="content" rows="5" class="form-control" required>{{ news.content }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Joriy rasm:</label><br>
                    {% if news.image %}
                        <img src="{{ url_for('static', filename='uploads/' + news.image) }}" class="img-thumbnail mb-2" style="max-height: 150px;"><br>
                    {% else %}
                        <p class="text-muted">Rasm yuklanmagan</p>
                    {% endif %}
                    <label class="form-label text-muted">Yangi rasm tanlash (ixtiyoriy):</label>
                    <input type="file" name="image" accept="image/*" class="form-control">
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">O'zgartirishni saqlash</button>
                <a href="/admin" class="btn btn-link text-secondary w-100 mt-2 text-center text-decoration-none">Bekor qilish</a>
            </form>
        </div>
    </div>
</body>
</html>
