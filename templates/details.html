<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ news.title }} - Batafsil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Yangiliklar Portali</a>
            <div>
                {% if session.get('is_admin') %}
                    <a href="/admin" class="btn btn-outline-warning btn-sm me-2">Admin Panel</a>
                {% endif %}
                <a href="/logout" class="btn btn-outline-danger btn-sm">Chiqish</a>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 800px;">
        <a href="/" class="btn btn-outline-secondary mb-3">&larr; Orqaga qarash</a>

        <div class="card shadow-sm border-0">
            {% if news.image %}
                <img src="{{ url_for('static', filename='uploads/' + news.image) }}" class="card-img-top style-detail-img" alt="{{ news.title }}" style="max-height: 450px; object-fit: cover;">
            {% endif %}

            <div class="card-body p-4">
                <h1 class="card-title fw-bold mb-3">{{ news.title }}</h1>
                <hr>
                <p class="card-text text-dark" style="font-size: 1.1rem; line-height: 1.8; white-space: pre-line;">
                    {{ news.content }}
                </p>
            </div>
        </div>
    </div>
</body>
</html>
